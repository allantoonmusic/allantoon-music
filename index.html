<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALLANTOON MUSIC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080808;
    --card:#151515;
    --card2:#1d1d1d;
    --text:#ffffff;
    --muted:#999;
    --red:#ff1744;
    --green:#22c55e;
}

body{
    background:linear-gradient(180deg,#090909,#111111);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding-bottom:130px;
}

button,
input{
    font:inherit;
}

/* HEADER */
header{
    padding:22px 18px 14px;
    background:#0b0b0b;
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:1px solid #242424;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-note{
    font-size:36px;
}

.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{
    color:var(--red);
}

.subtitle{
    color:#888;
    margin-top:7px;
    font-size:14px;
}

/* SEARCH */
.search{
    margin-top:18px;
    background:#1b1b1b;
    border-radius:30px;
    padding:12px 17px;
    border:1px solid #292929;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:16px;
}

.search input::placeholder{
    color:#777;
}

/* MAIN */
main{
    padding:25px 16px;
    max-width:720px;
    margin:auto;
}

.section-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:16px;
}

/* SONG CARDS */
.song{
    background:var(--card);
    border:1px solid #292929;
    border-radius:18px;
    padding:15px;
    margin-bottom:13px;
    display:flex;
    align-items:center;
    gap:13px;
    transition:.2s;
}

.song:hover{
    background:#202020;
}

.song-art{
    width:58px;
    height:58px;
    min-width:58px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff1744,#7c0020);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-weight:800;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    color:#999;
    font-size:13px;
    margin-top:5px;
}

.play-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:0;
    background:var(--red);
    color:white;
    font-size:19px;
    cursor:pointer;
}

/* EMPTY SEARCH */
.no-results{
    display:none;
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* NOW PLAYING */
.now-playing{
    margin-top:28px;
    background:var(--card);
    border:1px solid #292929;
    border-radius:22px;
    padding:20px;
}

.now-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
}

.now-artist{
    text-align:center;
    color:#999;
    margin-top:6px;
    font-size:14px;
}

/* PROGRESS */
.progress-area{
    margin-top:20px;
}

#progress{
    width:100%;
    accent-color:var(--red);
    cursor:pointer;
}

.time-row{
    display:flex;
    justify-content:space-between;
    color:#888;
    font-size:12px;
    margin-top:5px;
}

/* CONTROLS */
.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:17px;
}

.control{
    border:0;
    background:#292929;
    color:white;
    width:43px;
    height:43px;
    border-radius:50%;
    cursor:pointer;
}

.control.main{
    width:58px;
    height:58px;
    background:var(--red);
    font-size:21px;
}

/* VOLUME */
.volume{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
}

.volume input{
    flex:1;
    accent-color:var(--red);
}

/* FOOTER */
footer{
    text-align:center;
    color:#666;
    font-size:12px;
    padding:30px 15px;
}

/* SMALL PLAYER */
.mini-player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:100;
    background:rgba(18,18,18,.97);
    border-top:1px solid #333;
    padding:10px 13px;
    backdrop-filter:blur(10px);
}

.mini-inner{
    max-width:720px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:10px;
}

.mini-art{
    width:44px;
    height:44px;
    border-radius:11px;
    background:linear-gradient(135deg,#ff1744,#72001d);
    display:flex;
    align-items:center;
    justify-content:center;
}

.mini-info{
    flex:1;
    min-width:0;
}

.mini-title{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mini-status{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.mini-button{
    border:0;
    background:var(--red);
    color:white;
    width:42px;
    height:42px;
    border-radius:50%;
    cursor:pointer;
}

.mini-progress{
    position:absolute;
    top:-2px;
    left:0;
    height:2px;
    width:0%;
    background:var(--red);
}

/* MOBILE */
@media(max-width:500px){

    header{
        padding:18px 14px 12px;
    }

    main{
        padding:20px 12px;
    }

    .logo{
        font-size:23px;
    }

    .song{
        padding:12px;
    }

    .song-art{
        width:53px;
        height:53px;
        min-width:53px;
    }

    .controls{
        gap:13px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        <div class="logo-note">🎵</div>

        <div>
            <div class="logo">
                ALLANTOON <span>MUSIC</span>
            </div>

            <div class="subtitle">
                Official music player
            </div>
        </div>
    </div>

    <div class="search">
        <input
            id="search"
            type="text"
            placeholder="Search songs..."
            autocomplete="off"
        >
    </div>

</header>


<main>

    <div class="section-title">
        🎶 My Songs
    </div>


    <!-- SONG 1 -->
    <div
        class="song"
        data-title="ALLANTOON S TAKI STRESS OFFICIAL AUDIO"
        data-index="0"
    >

        <div class="song-art">
            🎵
        </div>

        <div class="song-info">

            <div class="song-title">
                ALLANTOON - S Taki Stress
            </div>

            <div class="song-artist">
                ALLANTOON
            </div>

        </div>

        <button
            class="play-btn"
            onclick="playSong(0)"
        >
            ▶
        </button>

    </div>


    <!-- SONG 2 -->
    <div
        class="song"
        data-title="HALLO BY ALLANTOON FT MZAE"
        data-index="1"
    >

        <div class="song-art">
            🎵
        </div>

        <div class="song-info">

            <div class="song-title">
                HALLO
            </div>

            <div class="song-artist">
                ALLANTOON ft MZAE
            </div>

        </div>

        <button
            class="play-btn"
            onclick="playSong(1)"
        >
            ▶
        </button>

    </div>


    <div
        id="noResults"
        class="no-results"
    >
        No song found.
    </div>


    <!-- NOW PLAYING -->
    <div class="now-playing">

        <div class="now-title" id="nowTitle">
            Select a song
        </div>

        <div class="now-artist" id="nowArtist">
            ALLANTOON MUSIC
        </div>


        <div class="progress-area">

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="controls">

            <button
                class="control"
                onclick="previousSong()"
            >
                ⏮
            </button>

            <button
                id="mainPlay"
                class="control main"
                onclick="togglePlay()"
            >
                ▶
            </button>

            <button
                class="control"
                onclick="nextSong()"
            >
                ⏭
            </button>

        </div>


        <div class="volume">

            <span>
                🔊
            </span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>

</main>


<footer>
    © 2026 ALLANTOON MUSIC
</footer>


<!-- SMALL FIXED PLAYER -->
<div class="mini-player">

    <div
        id="miniProgress"
        class="mini-progress"
    ></div>

    <div class="mini-inner">

        <div class="mini-art">
            🎵
        </div>

        <div class="mini-info">

            <div
                id="miniTitle"
                class="mini-title"
            >
                No song playing
            </div>

            <div
                id="miniStatus"
                class="mini-status"
            >
                ALLANTOON MUSIC
            </div>

        </div>

        <button
            id="miniPlay"
            class="mini-button"
            onclick="togglePlay()"
        >
            ▶
        </button>

    </div>

</div>


<!-- AUDIO -->
<audio id="audio" preload="metadata"></audio>


<script>

/* =========================================
   SONG LIST
========================================= */

const songs = [

    {
        title: "ALLANTOON - S Taki Stress",
        artist: "ALLANTOON",

        /*
        IMPORTANT:
        This filename must match GitHub exactly.
        */
        file: "ALLANTOON_-_S_TAKI_STRESS__OFFICIAL_AUDIO_(48k).m4a"
    },

    {
        title: "HALLO",
        artist: "ALLANTOON ft MZAE",

        /*
        This filename must match GitHub exactly.
        */
        file: "HALLO%20by%20ALLANTOON%20ft%20MZAE%20.mp3"
    }

];


/* =========================================
   PLAYER VARIABLES
========================================= */

const audio =
    document.getElementById("audio");

const progress =
    document.getElementById("progress");

const volume =
    document.getElementById("volume");

const mainPlay =
    document.getElementById("mainPlay");

const miniPlay =
    document.getElementById("miniPlay");

const nowTitle =
    document.getElementById("nowTitle");

const nowArtist =
    document.getElementById("nowArtist");

const miniTitle =
    document.getElementById("miniTitle");

const miniStatus =
    document.getElementById("miniStatus");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const miniProgress =
    document.getElementById("miniProgress");

let currentSong = -1;


/* =========================================
   PLAY SONG
========================================= */

function playSong(index){

    if(index < 0 || index >= songs.length){
        return;
    }

    currentSong = index;

    const song = songs[index];

    audio.src = song.file;

    nowTitle.textContent = song.title;
    nowArtist.textContent = song.artist;

    miniTitle.textContent = song.title;
    miniStatus.textContent = song.artist;

    audio.play()
        .then(() => {

            updateButtons();

        })
        .catch(error => {

            console.log("Playback error:", error);

            miniStatus.textContent =
                "Tap play again to start";

        });

}


/* =========================================
   TOGGLE PLAY
========================================= */

function togglePlay(){

    if(currentSong === -1){

        playSong(0);

        return;
    }


    if(audio.paused){

        audio.play()
            .then(() => {

                updateButtons();

            })
            .catch(error => {

                console.log(error);

            });

    }else{

        audio.pause();

        updateButtons();

    }

}


/* =========================================
   UPDATE BUTTONS
========================================= */

function updateButtons(){

    if(audio.paused){

        mainPlay.textContent = "▶";
        miniPlay.textContent = "▶";

    }else{

        mainPlay.textContent = "⏸";
        miniPlay.textContent = "⏸";

    }

}


/* =========================================
   NEXT SONG
========================================= */

function nextSong(){

    if(currentSong === -1){

        playSong(0);

        return;
    }

    let next =
        currentSong + 1;

    if(next >= songs.length){

        next = 0;

    }

    playSong(next);

}


/* =========================================
   PREVIOUS SONG
========================================= */

function previousSong(){

    if(currentSong === -1){

        playSong(0);

        return;
    }

    let previous =
        currentSong - 1;

    if(previous < 0){

        previous =
            songs.length - 1;

    }

    playSong(previous);

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds){

    if(!isFinite(seconds)){
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return minutes + ":" +
        (secs < 10 ? "0" : "") +
        secs;

}


/* =========================================
   AUDIO TIME UPDATE
========================================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(!audio.duration){
            return;
        }

        const percent =
            (audio.currentTime /
            audio.duration) * 100;

        progress.value = percent;

        miniProgress.style.width =
            percent + "%";

        currentTime.textContent =
            formatTime(audio.currentTime);

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =========================================
   PROGRESS BAR
========================================= */

progress.addEventListener(
    "input",
    function(){

        if(!audio.duration){
            return;
        }

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* =========================================
   VOLUME
========================================= */

volume.addEventListener(
    "input",
    function(){

        audio.volume =
            volume.value;

    }
);


/* =========================================
   SONG FINISHED
========================================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =========================================
   SEARCH
========================================= */

const search =
    document.getElementById("search");

const songCards =
    document.querySelectorAll(".song");

const noResults =
    document.getElementById("noResults");


search.addEventListener(
    "input",
    function(){

        const value =
            search.value
            .toLowerCase()
            .trim();

        let found = false;


        songCards.forEach(
            function(card){

                const title =
                    card
                    .getAttribute("data-title")
                    .toLowerCase();

                if(
                    title.includes(value)
                    ||
                    value === ""
                ){

                    card.style.display =
                        "flex";

                    found = true;

                }else{

                    card.style.display =
                        "none";

                }

            }
        );


        if(found){

            noResults.style.display =
                "none";

        }else{

            noResults.style.display =
                "block";

        }

    }
);


/* =========================================
   KEYBOARD SHORTCUTS
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code === "Space"){

            const tag =
                document.activeElement.tagName;

            if(
                tag !== "INPUT" &&
                tag !== "TEXTAREA"
            ){

                event.preventDefault();

                togglePlay();

            }

        }


        if(event.code === "ArrowRight"){

            if(audio.duration){

                audio.currentTime += 5;

            }

        }


        if(event.code === "ArrowLeft"){

            if(audio.duration){

                audio.currentTime -= 5;

            }

        }

    }
);


/* =========================================
   INITIAL SETTINGS
========================================= */

audio.volume = 1;

updateButtons();

</script>

</body>
</html>
