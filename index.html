<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALLANTOON MUSIC</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#090909;
  --card:#151515;
  --card2:#1d1d1d;
  --text:#ffffff;
  --muted:#888;
  --red:#ff1744;
  --blue:#54788b;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:120px;
}

button,input{
  font:inherit;
}

/* HEADER */
header{
  padding:22px 20px 12px;
  background:#0d0d0d;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-note{
  font-size:35px;
  color:var(--blue);
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  color:var(--red);
}

.subtitle{
  margin:10px 0 18px;
  color:#888;
}

/* SEARCH */
.search{
  margin:0 0 8px;
  background:#191919;
  border-radius:30px;
  padding:13px 18px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
}

/* MAIN */
main{
  padding:25px 20px;
  max-width:700px;
  margin:auto;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0;
}

.section-title h2{
  font-size:30px;
}

.section-title button{
  border:0;
  background:none;
  color:var(--red);
  font-size:16px;
}

/* FEATURED */
.featured{
  background:linear-gradient(135deg,#650525,#151515);
  border-radius:35px;
  padding:38px 30px;
  margin-bottom:45px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.new{
  color:#ddd;
  font-size:15px;
  margin-bottom:28px;
}

.featured h1{
  font-size:52px;
  margin-bottom:20px;
}

.artist{
  color:#ccc;
  font-size:22px;
  margin-bottom:38px;
}

.play-featured{
  border:0;
  background:var(--red);
  color:white;
  padding:18px 35px;
  border-radius:40px;
  font-weight:bold;
  font-size:20px;
  cursor:pointer;
}

/* SONGS */
.song{
  background:var(--card);
  border-radius:30px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
}

.cover{
  width:135px;
  height:135px;
  border-radius:25px;
  background:linear-gradient(135deg,#ff1744,#7b001f);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  flex-shrink:0;
}

.cover.blue{
  background:linear-gradient(135deg,#263746,#10151b);
}

.song-info{
  flex:1;
  min-width:0;
}

.song-info h3{
  font-size:24px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-info p{
  color:#888;
  margin-top:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song button{
  width:65px;
  height:65px;
  border-radius:50%;
  border:0;
  background:var(--red);
  color:white;
  font-size:25px;
  cursor:pointer;
  flex-shrink:0;
}

/* BOTTOM PLAYER */
.player{
  position:fixed;
  left:12px;
  right:12px;
  bottom:70px;
  background:#181818;
  border:1px solid #333;
  border-radius:28px;
  padding:15px;
  z-index:30;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.player-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.player-cover{
  width:70px;
  height:70px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff1744,#70001d);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-info h3{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-info p{
  color:#888;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.controls button{
  border:0;
  background:none;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.controls .main-play{
  width:58px;
  height:58px;
  border-radius:50%;
  background:white;
  color:#111;
}

.progress{
  width:100%;
  margin-top:12px;
}

#progress{
  width:100%;
  accent-color:var(--red);
}

.time{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* NAVIGATION */
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:40;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:13px;
}

.nav-item div{
  font-size:30px;
  margin-bottom:3px;
}

.nav-item.active{
  color:var(--red);
}

/* MOBILE */
@media(max-width:500px){

  main{
    padding:20px 18px;
  }

  .featured{
    padding:35px 25px;
  }

  .featured h1{
    font-size:46px;
  }

  .song{
    padding:14px;
  }

  .cover{
    width:100px;
    height:100px;
    font-size:40px;
  }

  .song-info h3{
    font-size:21px;
  }

  .song button{
    width:58px;
    height:58px;
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">
    <div class="logo-note">♫</div>
    <div class="logo">
      ALLANTOON <span>MUSIC</span>
    </div>
  </div>

  <div class="subtitle">
    Your music. Your sound. Your world.
  </div>

  <div class="search">
    🔎
    <input
      type="text"
      id="search"
      placeholder="Search your music..."
      oninput="searchSongs()"
    >
  </div>

</header>


<main>

  <!-- FEATURED -->

  <div class="section-title">
    <h2>🔥 Featured</h2>
    <button onclick="playSong(0)">
      Play featured
    </button>
  </div>

  <section class="featured">

    <div class="new">
      NEW RELEASE
    </div>

    <h1>HALLO</h1>

    <div class="artist">
      ALLANTOON ft MZAE
    </div>

    <button
      class="play-featured"
      onclick="playSong(0)"
    >
      ▶ PLAY
    </button>

  </section>


  <!-- YOUR MUSIC -->

  <div class="section-title">
    <h2>🎵 Your Music</h2>
    <button>
      Add songs
    </button>
  </div>


  <!-- HALLO -->

  <div class="song" data-title="hallo">

    <div class="cover">
      ♪
    </div>

    <div class="song-info">
      <h3>HALLO</h3>
      <p>ALLANTOON ft MZAE</p>
    </div>

    <button onclick="playSong(0)">
      ▶
    </button>

  </div>


  <!-- STAKI STRESS -->

  <div class="song" data-title="staki stress">

    <div class="cover blue">
      ♫
    </div>

    <div class="song-info">
      <h3>STAKI STRESS</h3>
      <p>ALLANTOON</p>
    </div>

    <button onclick="playSong(1)">
      ▶
    </button>

  </div>

</main>


<!-- AUDIO PLAYER -->

<div class="player">

  <div class="player-top">

    <div class="player-cover">
      ♪
    </div>

    <div class="player-info">
      <h3 id="playerTitle">
        HALLO
      </h3>

      <p id="playerArtist">
        ALLANTOON ft MZAE
      </p>
    </div>

    <div class="controls">

      <button onclick="previousSong()">
        |◀
      </button>

      <button
        class="main-play"
        id="playButton"
        onclick="togglePlay()"
      >
        ▶
      </button>

      <button onclick="nextSong()">
        ▶|
      </button>

    </div>

  </div>


  <div class="progress">

    <input
      type="range"
      id="progress"
      value="0"
      min="0"
      max="100"
      step="0.1"
      oninput="seekMusic()"
    >

    <div class="time">

      <span id="currentTime">
        0:00
      </span>

      <span id="duration">
        0:00
      </span>

    </div>

  </div>

</div>


<!-- NAVIGATION -->

<nav>

  <div class="nav-item active">
    <div>🏠</div>
    Home
  </div>

  <div class="nav-item">
    <div>🎵</div>
    Music
  </div>

  <div class="nav-item">
    <div>❤️</div>
    Favorites
  </div>

  <div class="nav-item">
    <div>👤</div>
    Profile
  </div>

</nav>


<!-- REAL AUDIO FILES -->

<audio id="audio"></audio>


<script>

/*
  =====================================================
  ALLANTOON MUSIC PLAYER
  =====================================================
*/

const songs = [

  {
    title: "HALLO",
    artist: "ALLANTOON ft MZAE",
    file: "HALLO.mp3"
  },

  {
    title: "STAKI STRESS",
    artist: "ALLANTOON",
    file: "STAKI_STRESS.mp3"
  }

];


let currentSong = 0;

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const playerTitle =
  document.getElementById("playerTitle");

const playerArtist =
  document.getElementById("playerArtist");


/* LOAD SONG */

function loadSong(index){

  currentSong = index;

  const song = songs[index];

  audio.src = song.file;

  playerTitle.textContent =
    song.title;

  playerArtist.textContent =
    song.artist;

  progress.value = 0;

  currentTime.textContent =
    "0:00";

  duration.textContent =
    "0:00";
}


/* PLAY SONG */

function playSong(index){

  loadSong(index);

  audio.play()
    .then(() => {

      playButton.textContent = "❚❚";

    })
    .catch(() => {

      alert(
        "The audio file could not be played. Check that the MP3 filename matches the code."
      );

    });
}


/* PLAY / PAUSE */

function togglePlay(){

  if(!audio.src){

    loadSong(currentSong);

  }

  if(audio.paused){

    audio.play()
      .then(() => {

        playButton.textContent =
          "❚❚";

      })
      .catch(() => {

        alert(
          "Audio file not found. Make sure the MP3 files are uploaded to GitHub."
        );

      });

  }else{

    audio.pause();

    playButton.textContent =
      "▶";

  }

}


/* NEXT */

function nextSong(){

  currentSong++;

  if(currentSong >= songs.length){

    currentSong = 0;

  }

  playSong(currentSong);

}


/* PREVIOUS */

function previousSong(){

  currentSong--;

  if(currentSong < 0){

    currentSong =
      songs.length - 1;

  }

  playSong(currentSong);

}


/* AUDIO PLAYING */

audio.addEventListener(
  "timeupdate",
  function(){

    if(audio.duration){

      progress.value =
        (audio.currentTime /
        audio.duration) * 100;

      currentTime.textContent =
        formatTime(audio.currentTime);

    }

  }
);


/* AUDIO LOADED */

audio.addEventListener(
  "loadedmetadata",
  function(){

    duration.textContent =
      formatTime(audio.duration);

  }
);


/* AUDIO ENDED */

audio.addEventListener(
  "ended",
  function(){

    nextSong();

  }
);


/* PLAY EVENT */

audio.addEventListener(
  "play",
  function(){

    playButton.textContent =
      "❚❚";

  }
);


/* PAUSE EVENT */

audio.addEventListener(
  "pause",
  function(){

    playButton.textContent =
      "▶";

  }
);


/* SEEK */

function seekMusic(){

  if(audio.duration){

    audio.currentTime =
      (progress.value / 100)
      * audio.duration;

  }

}


/* FORMAT TIME */

function formatTime(seconds){

  if(!seconds || isNaN(seconds)){

    return "0:00";

  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    (secs < 10 ? "0" : "") +
    secs
  );

}


/* SEARCH */

function searchSongs(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const songCards =
    document.querySelectorAll(".song");

  songCards.forEach(
    function(card){

      const title =
        card
          .getAttribute("data-title")
          .toLowerCase();

      if(title.includes(search)){

        card.style.display =
          "flex";

      }else{

        card.style.display =
          "none";

      }

    }
  );

}


/* START WITH HALLO */

loadSong(0);

</script>

</body>
 </html>
